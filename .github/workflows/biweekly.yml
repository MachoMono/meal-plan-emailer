name: Biweekly meal-plan emailer

on:
  schedule:
    - cron: "0 13 * * 0"  # Every Sunday 13:00 UTC = 8am Central
  workflow_dispatch:
    inputs:
      force:
        description: "Run regardless of even/odd week"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run emailer
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python src/main.py --force
          else
            python src/main.py
          fi

      - name: Commit history.json if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "chore: update theme history [skip ci]"
          git push
